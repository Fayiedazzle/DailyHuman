<script>
function cyrb53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}
function mulberry32(a){return function(){var t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}}

function randPick(rand, arr){return arr[Math.floor(rand()*arr.length)]}
let currentTab='card'; let lastName='BRIAN';
function generate(){
 const raw=(document.getElementById('nameInput').value.trim()||'Brian').toUpperCase();
 lastName=raw;
 const seed=cyrb53(raw+"|"+todayStr+"|"+currentTab);
 const rand=mulberry32(seed);
 draw(raw, rand);
}
function draw(name, rand){
 const c=document.getElementById('cardCanvas'); const ctx=c.getContext('2d');
 ctx.clearRect(0,0,1080,1350);
 let bg="#f5f1e8";
 if(currentTab==='fbi') bg="#ece6d6";

 if(currentTab==='glitch') bg="#151515";
 if(currentTab==='card'){ bg="#f5f1e8"; }
 ctx.fillStyle=bg; ctx.fillRect(0,0,1080,1350);
 const darkText = bg.startsWith("#f")||bg.startsWith("#e");
 const txt = darkText?"#111":"#f0ebe1";
 const muted = darkText?"#5a5a5a":"#8a8a8a";
 const nude="#d9c5a0";
 if(currentTab==='price'){
  ctx.fillStyle=txt; ctx.font="700 27px 'JetBrains Mono'";

  const isDown=rand()>0.3;

  ctx.fillText("PRICE: "+price+" ("+(isDown?"DOWN":"UP")+" -"+down+"% today)",60,190);
  ctx.font="600 30px 'Space Grotesk'"; ctx.fillStyle=muted;
  wrap(ctx,"MARKET MOOD: "+randPick(rand,ROASTS.price_mood),60,250,960,38);
  wrap(ctx,"SELL SIGNAL: "+randPick(rand,ROASTS.price_sell),60,295,960,38);
  ctx.fillStyle=nude; ctx.fillRect(60,345,960,1);
  ctx.fillStyle=txt; ctx.font="800 28px 'JetBrains Mono'"; ctx.fillText("TODAY'S STATS:",60,395);
  const hustle=Math.floor(rand()*100); const rizz=Math.floor(rand()*100); const luck=Math.floor(rand()*30);
  ctx.font="600 26px 'JetBrains Mono'";
  ctx.fillText("Hustle: "+hustle+"% - "+(hustle<30?"Turn off data and sleep":hustle<60?"Trying but bundles low":"CEO grind today"),60,440);
  ctx.fillText("Rizz: "+rizz+"% - "+(rizz>80?"Dangerous today":rizz>50?"Mid but trying":"No rizz found"),60,480);
  ctx.fillText("Luck: "+luck+"% - "+(luck<10?"Don't bet":"Maybe play lotto"),60,520);
  ctx.fillStyle=nude; ctx.fillRect(60,570,960,1);
  ctx.font="400 24px 'JetBrains Mono'"; ctx.fillStyle=muted;
  let analyst=randPick(rand,ROASTS.price_analyst).replace("{N}",name);
  wrap(ctx,'ANALYST NOTE: "'+analyst+'"',60,620,960,34);
  ctx.font="600 22px 'JetBrains Mono'"; ctx.fillStyle=muted; ctx.fillText("DailyHuman - "+datePretty+" 2026",60,1280);
 } else if(currentTab==='fbi'){
  ctx.fillStyle=txt; ctx.font="800 30px 'JetBrains Mono'"; ctx.fillText("*** CONFIDENTIAL - FBI DAILY LEAK ***",60,90);
  ctx.fillRect(60,110,960,2);
  ctx.font="700 38px 'Space Grotesk'"; ctx.fillText("SUBJECT: "+name,60,180);
  ctx.font="600 26px 'JetBrains Mono'";
  wrap(ctx,"THREAT LEVEL: "+randPick(rand,ROASTS.fbi_mood),60,240,960,32);
  wrap(ctx,"LAST SEEN: "+randPick(rand,ROASTS.fbi_seen),60,280,960,32);
  wrap(ctx,"SECRET: "+randPick(rand,ROASTS.fbi_secret),60,320,960,32);
  ctx.fillStyle=nude; ctx.fillRect(60,370,960,1);
  ctx.fillStyle=txt; ctx.font="600 28px 'Space Grotesk'";
  wrap(ctx,"TODAY'S TRACKING: "+randPick(rand,ROASTS.fbi_tracking),60,420,960,38);
  ctx.font="400 24px 'JetBrains Mono'"; ctx.fillStyle=muted;
  wrap(ctx,"FILE ID: #"+Math.floor(rand()*90000+10000)+" | STATUS: "+randPick(rand,ROASTS.fbi_status),60,500,960,32);
  ctx.font="600 22px 'JetBrains Mono'"; ctx.fillText("DailyHuman - "+datePretty+" 2026",60,1280);
 } else if(currentTab==='glitch'){
  ctx.fillStyle=txt; ctx.font="700 26px 'JetBrains Mono'";
  ctx.fillText("SYSTEM ERROR REPORT - "+datePretty,60,90);
  ctx.fillStyle=nude; ctx.fillRect(60,110,960,2);
  ctx.fillStyle="#d9c5a0"; ctx.font="800 42px 'Space Grotesk'";
  wrap(ctx,"YOU ARE: "+randPick(rand,ROASTS.glitch_bugs).toUpperCase(),60,190,960,52);
  ctx.fillStyle=txt; ctx.font="600 28px 'Space Grotesk'";
  wrap(ctx,"BUG: "+randPick(rand,ROASTS.glitch_bug2),60,300,960,36);
  wrap(ctx,"FIX: "+randPick(rand,ROASTS.glitch_fix),60,350,960,36);
  ctx.fillStyle=nude; ctx.fillRect(60,400,960,1);

  ctx.font="600 22px 'JetBrains Mono'"; ctx.fillText("DailyHuman - "+datePretty+" 2026",60,1280);
 } else {
  const day=today.getDay();

  else if(day===2) title="Unserious Report Card";
  else if(day===3) title="Daily Excuse Card";

  }
  ctx.font="600 22px 'JetBrains Mono'"; ctx.fillStyle=muted; ctx.fillText("DailyHuman - "+datePretty+" 2026",60,1280);
 }
}
function wrap(ctx, text, x, y, maxW, lh){
 const words=text.split(' '); let line=''; let yy=y;
 for(let i=0;i<words.length;i++){ const test=line+words[i]+' '; if(ctx.measureText(test).width>maxW && i>0){ ctx.fillText(line,x,yy); line=words[i]+' '; yy+=lh;} else line=test;}
 ctx.fillText(line,x,yy);
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',e=>{

 const r=mulberry32(cyrb53(lastName+"|"+todayStr+"|"+currentTab)); draw(lastName,r);
}));
document.getElementById('genBtn').addEventListener('click', generate);
document.getElementById('nameInput').addEventListener('keydown',e=>{if(e.key==='Enter')generate()});

 const a=document.createElement('a'); a.download=`DailyHuman-${currentTab}-${lastName}-${todayStr}.png`; a.href=c.toDataURL('image/png'); a.click();
});
generate();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
